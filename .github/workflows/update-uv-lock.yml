name: Refresh uv lock file

on:
  push:
    branches:
      - feature/resume-tailoring-version-history
    paths:
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/resume-tailoring-version-history
      - uses: astral-sh/setup-uv@v6
      - name: Regenerate lock
        run: uv lock
      - name: Commit lock changes
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "Update uv.lock for resume dependencies"
          git push origin HEAD:feature/resume-tailoring-version-history
