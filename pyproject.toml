[project]
name = "autonomous-job-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhik Das", email = "abhikdss98123@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10,<4.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic-settings>=2.4,<3.0",
    "pytest>=8.0,<9.0",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.32,<3.0",
    "streamlit>=1.38,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
autonomous-job-agent = "autonomous_job_agent:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
